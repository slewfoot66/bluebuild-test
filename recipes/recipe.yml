name: my-zirconium
description: Zirconium plus my apps
base-image: ghcr.io/zirconium-dev/zirconium
image-version: latest

modules:
  - type: dnf
    install:
      packages:
        - kitty
        - squeekboard
        - gsettings-desktop-schemas

  # Automatically deploy your wide desktop yaml layout to the system profile
  - type: files
    globs:
      - usr/share/squeekboard/keyboards/terminal/us.yaml

  # Automatically enable the screen keyboard system flag on boot
  - type: gschema-overrides
    include:
      - 01-squeekboard.gschema.override

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.google.Chrome
