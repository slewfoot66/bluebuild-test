# yaml-language-server: $schema=https://blue-build.org

name: my-zirconium-nvidia
description: zirconium-nvidia.yml plus my apps
base-image: ghcr.io/zirconium-dev/zirconium-nvidia
image-version: latest
modules:
  - type: dnf
    install:
      packages:
        - kitty
        - python3-uinput
        - steam-devices
        - python3-setuptools
        - python3-xlib
        - gtk-layer-shell

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.google.Chrome