name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # build at 06:00 UTC every day
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
          - recipe-zirconium-nvidia.yml
    steps:
      - name: Build Custom Image (Attempt 1)
        id: build1
        continue-on-error: true
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          build_opts: --run-driver=podman --build-driver=podman
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false

      - name: Wait before retry
        if: steps.build1.outcome == 'failure'
        run: sleep 60

      - name: Build Custom Image (Attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          build_opts: --run-driver=podman --build-driver=podman
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false

      - name: Wait before final retry
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        run: sleep 120

      - name: Build Custom Image (Attempt 3)
        id: build3
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          build_opts: --run-driver=podman --build-driver=podman
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

      - name: Check final status
        if: always()
        run: |
          if [[ "${{ steps.build1.outcome }}" == "success" ]] || \
             [[ "${{ steps.build2.outcome }}" == "success" ]] || \
             [[ "${{ steps.build3.outcome }}" == "success" ]]; then
            echo "✅ Build succeeded"
            exit 0
          else
            echo "❌ Build failed after 3 attempts"
            exit 1
          fi