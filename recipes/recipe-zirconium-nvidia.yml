# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: my-zirconium-nvidia
description: zirconium-nvidia.yml plus my apps
base-image: ghcr.io/zirconium-dev/zirconium-nvidia
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - che/nerd-fonts          # ← MUST be owner/project
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc

      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo

    install:
      packages:
        - kitty
        - python3-uinput
        - python3-setuptools
        - python3-xlib
        - gtk-layer-shell
        - qt6-qtvirtualkeyboard
 # Install Chrome Beta directly from Google's always-current RPM URL
        - https://dl.google.com/linux/direct/google-chrome-beta_current_x86_64.rpm
        - ydotool
        - qt6-qtwayland
        - python3-pip
        - sox
        - pulseaudio-utils
        - brave-browser
        - nerd-fonts              # ← actual RPM package name from che/nerd-fonts

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.google.Chrome